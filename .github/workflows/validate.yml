name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a client release cannot change the verdict silently. Bump on
  # purpose and re-run the local evals (README "Evals").
  CLAUDE_CODE_VERSION: 2.1.287
  CODEX_VERSION: 0.160.0

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Repository checks (Agent Plugins schemas, skill YAML, cross-file rules)
        run: pnpm validate

      - name: The repository checks still catch each rule they name
        run: pnpm test

      # No credentials: every step below runs without a model call or sign-in,
      # in throwaway homes, so nothing reaches FutureClinic's server.
      - name: Claude Code validate --strict (marketplace and plugin)
        env:
          HOME: ${{ runner.temp }}/claude-home
        run: |
          mkdir -p "$HOME"
          pnpm --silent dlx "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" plugin validate . --strict
          pnpm --silent dlx "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" plugin validate plugins/futureclinic --strict

      - name: Claude Code installs it from this marketplace
        env:
          HOME: ${{ runner.temp }}/claude-home
        run: |
          claude() { pnpm --silent dlx "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" "$@"; }
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          claude plugin install futureclinic@futureclinic
          claude plugin list --json > "$RUNNER_TEMP/claude-plugins.json"
          node -e '
            const plugins = require(process.argv[1]);
            const fc = plugins.find((p) => p.id === "futureclinic@futureclinic");
            const server = fc?.mcpServers?.futureclinic;
            if (!fc?.enabled || server?.url !== "https://mcp.futureclinic.com/mcp") {
              console.error(JSON.stringify(plugins, null, 2));
              process.exit(1);
            }
            console.log(`futureclinic ${fc.version} installed, server ${server.type} ${server.url}`);
          ' "$RUNNER_TEMP/claude-plugins.json"

      - name: Codex installs it from this marketplace
        env:
          HOME: ${{ runner.temp }}/codex-user-home
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          mkdir -p "$HOME" "$CODEX_HOME"
          codex() { pnpm --silent dlx "@openai/codex@${CODEX_VERSION}" "$@"; }
          codex plugin marketplace add "$GITHUB_WORKSPACE"
          codex plugin add futureclinic@futureclinic
          codex mcp list --json > "$RUNNER_TEMP/codex-mcp.json"
          node -e '
            const servers = require(process.argv[1]);
            const fc = servers.find((s) => s.name === "futureclinic");
            if (!fc?.enabled || fc.transport?.url !== "https://mcp.futureclinic.com/mcp") {
              console.error(JSON.stringify(servers, null, 2));
              process.exit(1);
            }
            console.log(`codex server ${fc.name} ${fc.transport.type} ${fc.transport.url}`);
          ' "$RUNNER_TEMP/codex-mcp.json"
          codex debug prompt-input hi > "$RUNNER_TEMP/codex-prompt-input.json"
          grep -q "futureclinic:chat" "$RUNNER_TEMP/codex-prompt-input.json"
          echo "codex lists skill futureclinic:chat"
